apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: jukebox-e2e-test
spec:
  params:
    - name: git-url
      type: string
      default: https://github.com/rhoai-mlops/jukebox-ui.git
    - name: git-revision
      type: string
      default: main
    - name: API_URL
      type: string
  steps:
    - name: get-code-and-test
      image: cypress/browsers:latest
      env: 
        - name: API_URL
          value: $(params.API_URL)
        - name: NO_COLOR
          value: "1"
      script: |
        echo "👨‍💻 getting code 👨‍💻"
        git clone $(params.git-url)
        cd jukebox-ui
        git checkout $(params.git-revision)
        ls -la 
        echo "🐌 installing deps 🐌"
        npm ci
        echo "🧑‍🔬 runnig tests 🧪"
        npm run test:e2e
  volumes:
    - name: example-volume
      emptyDir: {}