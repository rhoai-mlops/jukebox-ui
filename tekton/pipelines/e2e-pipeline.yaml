apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: jukebox-e2e-pipeline
spec:
  params:
    - name: git-url
      type: string
      default: https://github.com/rhoai-mlops/jukebox-ui.git
    - name: API_URL
      type: string
  tasks:
    - name: run-e2e-tests
      taskRef:
        name: jukebox-e2e-test
      params:
        - name: git-url
          value: $(params.git-url)
        - name: API_URL
          value: $(params.API_URL)